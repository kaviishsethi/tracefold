[project]
name = "tracefold"
version = "0.1.0"
description = "Tracefold shared scan engine"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
tracefold = "tracefold.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tracefold"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "live: opt-in tests that call real external providers (TRACEFOLD_LIVE=1)",
  "ollama: opt-in tests that need a real local Ollama (TRACEFOLD_OLLAMA=1)",
]
